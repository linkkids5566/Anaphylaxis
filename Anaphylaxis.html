<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>麻醉重大病安學習島 | 臺中榮總麻訓班</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes dashFlow {
      from { stroke-dashoffset: 28; }
      to { stroke-dashoffset: 0; }
    }
    .collab-dash {
      animation: dashFlow 1.8s linear infinite;
    }
    @keyframes pulseRing {
      0%, 100% { r: 32px; opacity: 0.95; }
      50% { r: 40px; opacity: 0.45; }
    }
    .beacon-pulse {
      animation: pulseRing 1.6s ease-in-out infinite;
    }
    .island-group {
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .island-group:hover {
      transform: translateY(-6px);
    }
    .island-selected {
      transform: translateY(-6px);
    }
    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
  </style>
</head>
<body id="app-body" class="min-h-screen w-full transition-colors duration-700 bg-gradient-to-br from-sky-200 via-cyan-100 to-teal-200 flex flex-col select-none overflow-x-hidden pb-10">

  <!-- ==========================================
       頂部導航列 (Header)
       ========================================== -->
  <header class="sticky top-0 z-30 backdrop-blur-md bg-slate-900/90 border-b border-white/15 px-3.5 py-3 sm:px-6">
    <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <!-- 左側 Logo 與標題 -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-amber-500 to-teal-400 flex items-center justify-center shadow-lg shadow-amber-500/20 border border-white/30 shrink-0">
          <i class="ph-bold ph-compass text-2xl text-slate-950 animate-pulse"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs sm:text-sm font-bold tracking-wider uppercase px-2.5 py-0.5 rounded-md bg-amber-500/20 text-amber-300 border border-amber-400/30">
              臺中榮總麻訓班
            </span>
            <span class="hidden md:inline-flex items-center gap-1 text-xs text-teal-300 bg-teal-950/80 px-2.5 py-0.5 rounded-md border border-teal-500/30">
              <i class="ph-fill ph-sparkle"></i> 楊士杰醫師簡報 × 課後考點導航
            </span>
          </div>
          <h1 class="text-lg sm:text-2xl font-extrabold text-white tracking-tight flex items-center gap-2 mt-0.5">
            麻醉重大病安學習島
            <span class="text-xs font-normal text-slate-400 hidden sm:inline">
              ANESTHESIA SAFETY ISLAND
            </span>
          </h1>
        </div>
      </div>

      <!-- 中間：島嶼探索進度條 -->
      <div class="hidden xl:flex items-center gap-4 bg-slate-800/90 border border-slate-700 px-4 py-1.5 rounded-full">
        <div class="flex items-center gap-2 text-sm text-amber-300">
          <i class="ph-bold ph-medal text-amber-400"></i>
          <span>中央考點解鎖：</span>
          <span id="progress-hints" class="font-bold text-white">1 / 5</span>
        </div>
        <div class="h-3 w-[1px] bg-slate-600"></div>
        <div class="flex items-center gap-2 text-sm text-teal-300">
          <i class="ph-bold ph-navigation-arrow text-teal-400"></i>
          <span>登陸島嶼：</span>
          <span id="progress-islands" class="font-bold text-white">1 / 7</span>
        </div>
      </div>

      <!-- 右側控制按鈕群 -->
      <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
        <!-- 時段光影切換 -->
        <div class="flex items-center bg-slate-800/90 p-1 rounded-xl border border-slate-700">
          <button onclick="setTimeOfDay('day')" id="btn-time-day" title="晨會白班模式" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-sky-400 text-slate-950 shadow">
            <i class="ph-bold ph-sun text-base"></i>
            <span class="hidden sm:inline">白班</span>
          </button>
          <button onclick="setTimeOfDay('dusk')" id="btn-time-dusk" title="交班黃昏模式" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-300 hover:text-white">
            <i class="ph-bold ph-sun-horizon text-base"></i>
            <span class="hidden sm:inline">交班</span>
          </button>
          <button onclick="setTimeOfDay('night')" id="btn-time-night" title="值班夜班模式" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-300 hover:text-white">
            <i class="ph-bold ph-moon-stars text-base"></i>
            <span class="hidden sm:inline">夜班</span>
          </button>
        </div>

        <!-- 協作線開關 -->
        <button onclick="toggleCollabLines()" id="btn-collab" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition bg-slate-800/80 border-slate-700 text-slate-400 hover:text-white">
          <i class="ph-bold ph-git-branch text-base"></i>
          <span class="hidden md:inline">病安協作線</span>
        </button>

        <!-- 地圖 / 清單切換 -->
        <button onclick="toggleViewMode()" id="btn-view-mode" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 border border-slate-600 text-slate-100 hover:bg-slate-700 transition">
          <i id="icon-view-mode" class="ph-bold ph-list-magnifying-glass text-teal-400 text-base"></i>
          <span id="text-view-mode">全島頁碼清單</span>
        </button>

        <!-- 急救劑量計算機 -->
        <button onclick="openModal('calculator')" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-teal-600 hover:bg-teal-500 text-white shadow-md shadow-teal-900/30 transition">
          <i class="ph-bold ph-calculator text-base"></i>
          <span>劑量速算</span>
        </button>

        <!-- 兩大急症對照表 -->
        <button onclick="openModal('sopCompare')" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-md transition">
          <i class="ph-bold ph-stack text-base"></i>
          <span>急症對照</span>
        </button>

        <!-- 課後測驗闖關自測 -->
        <button onclick="openModal('quiz')" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 shadow-lg shadow-amber-500/25 transition">
          <i class="ph-bold ph-check-circle text-base"></i>
          <span>課後自測驗收</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==========================================
       主內容區：地圖模式 vs 清單模式
       ========================================== -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto p-2.5 sm:p-5">
    <!-- 1. 3D 學習島地圖模式 -->
    <div id="map-view-container" class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
      <!-- 左側 7 欄：快速選島按鈕面板 + 3D 等距六角漂浮島 SVG -->
      <div class="lg:col-span-7 flex flex-col gap-3">
        <!-- 手機友善雙欄/三欄大按鈕島嶼導覽區 -->
        <div id="island-nav-grid" class="bg-slate-900/90 border border-white/15 rounded-2xl p-2.5 sm:p-3 shadow-lg space-y-2">
          <!-- 由 JS 動態渲染 -->
        </div>

        <!-- 3D 視覺化六角群島 SVG 容器 -->
        <div class="relative w-full rounded-3xl overflow-hidden border-2 border-white/25 shadow-2xl bg-slate-950/30 backdrop-blur-sm">
          <div id="svg-map-wrapper" class="w-full">
            <!-- 由 JS 動態渲染 680x760 SVG -->
          </div>

          <!-- 底部：鳥獸戲畫青蛙醫師 & 兔兔麻護互動廣播吧 -->
          <div class="bg-slate-950/95 border-t border-white/15 px-4 py-3.5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
            <div class="flex items-start sm:items-center gap-3">
              <button onclick="nextAvatarQuote()" id="avatar-emoji-btn" class="shrink-0 w-12 h-12 rounded-full bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-2xl shadow border border-white/30 hover:scale-105 transition" title="點擊切換小精靈提示">
                🐸
              </button>
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <span id="avatar-speaker" class="text-base font-extrabold text-amber-400"></span>
                  <span class="text-xs text-slate-400">（投影片 P.1 吉祥物叮嚀）</span>
                </div>
                <p id="avatar-text" class="text-base text-slate-100 leading-relaxed mt-1"></p>
              </div>
            </div>
            <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
              <button onclick="goToAvatarIsland()" class="text-sm px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-teal-300 font-bold transition flex items-center gap-1">
                <span>前往該島</span>
                <i class="ph-bold ph-caret-right"></i>
              </button>
              <button onclick="nextAvatarQuote()" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/15 text-slate-300" title="下一則叮嚀">
                <i class="ph-bold ph-arrows-clockwise text-base"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 右側 5 欄：島嶼詳情與考點提示抽屜 -->
      <div id="detail-panel-container" class="lg:col-span-5 flex flex-col gap-3">
        <!-- 由 JS 動態渲染中央大島或六大主題島內容 -->
      </div>
    </div>

    <!-- 2. 全島考點與頁碼清單模式 (預設隱藏) -->
    <div id="list-view-container" class="hidden space-y-4">
      <div class="rounded-3xl bg-slate-900/95 border border-white/15 p-4 sm:p-6 text-slate-100 shadow-2xl">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-800">
          <div>
            <h2 class="text-xl sm:text-2xl font-black text-white flex items-center gap-2">
              <i class="ph-bold ph-list-magnifying-glass text-teal-400"></i>
              全島考點提示與投影片頁碼總覽清單
            </h2>
            <p class="text-sm sm:text-base text-slate-400 mt-1">
              可輸入關鍵字（如：Tryptase、3350、SMOFlipid、鈉離子、Xylocaine、P.11）快速檢索對應投影片頁數
            </p>
          </div>
          <!-- 搜尋框 -->
          <div class="relative w-full md:w-80">
            <i class="ph-bold ph-magnifying-glass text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input
              type="text"
              id="search-input"
              oninput="handleSearchInput(this.value)"
              placeholder="搜尋考點、藥名、分機或頁碼..."
              class="w-full pl-10 pr-8 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm sm:text-base text-white placeholder-slate-400 focus:outline-none focus:border-teal-400"
            />
          </div>
        </div>
        <!-- 檢索結果網格 -->
        <div id="search-results-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 mt-4">
          <!-- 由 JS 動態渲染 -->
        </div>
      </div>
    </div>
  </main>

  <!-- ==========================================
       互動彈窗容器 (Modals: 劑量速算 / 急症對照 / 課後自測)
       ========================================== -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center p-3 sm:p-6">
    <div id="modal-content" class="w-full max-w-4xl"></div>
  </div>

       JavaScript 資料庫與互動渲染邏輯
       ========================================== -->

    function getHexPoints(cx, cy, radius, squash = 0.85) {
      const angles = [0, 60, 120, 180, 240, 300];
      return angles
        .map((deg) => {
          const rad = (Math.PI / 180) * deg;
          const px = cx + radius * Math.cos(rad);
          const py = cy + radius * Math.sin(rad) * squash;
          return `${px.toFixed(1)},${py.toFixed(1)}`;
        })
        .join(' ');
    }

      const q = state.searchQuery.trim().toLowerCase();
      const results = [];

      CENTER_ISLAND_DATA.landmarks.forEach((lm) => {
        const pool = `${lm.badge} ${lm.name} ${lm.shortHint} ${lm.slideRef} ${lm.keyHints.join(' ')} ${lm.clinicalClue}`.toLowerCase();
        if (!q || pool.includes(q)) {
          results.push({
            type: 'EXAM_HINT',
            id: lm.id,
            islandId: 'CENTER',
            badge: lm.badge,
            title: lm.name,
            pageRef: lm.slideRef,
            details: lm.keyHints,
            color: '#F59E0B'
          });
        }
      });

      SURROUNDING_ISLANDS.forEach((isl) => {
        isl.buildings.forEach((b, idx) => {
          const pool = `${isl.title} ${b.name} ${b.slide} ${b.tag} ${b.points.join(' ')}`.toLowerCase();
          if (!q || pool.includes(q)) {
            results.push({
              type: 'BUILDING',
              id: `${isl.id}-B${idx}`,
              islandId: isl.id,
              badge: isl.title,
              title: b.name,
              pageRef: `投影片 ${b.slide}`,
              details: b.points,
              color: isl.color
            });
          }
        });
      });

      grid.innerHTML = results
        .map((item) => {
          const detailsHtml = item.details
            .map((d) => `<li class="flex items-start gap-2"><span class="text-teal-400 font-bold">•</span><span>${d}</span></li>`)
            .join('');
          const jumpAction =
            item.type === 'EXAM_HINT'
              ? `jumpFromListToHint('${item.id}')`
              : `jumpFromListToIsland('${item.islandId}')`;

          return `
            <div class="rounded-2xl bg-slate-800/80 border border-slate-700 p-4 flex flex-col justify-between gap-3 hover:border-teal-400/60 transition">
              <div class="space-y-2.5">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full text-slate-950" style="background-color: ${item.color}">
                    ${item.badge}
                  </span>
                  <span class="text-xs sm:text-sm font-bold text-amber-300 bg-slate-950 px-2.5 py-1 rounded-lg border border-amber-500/30">
                    ${item.pageRef}
                  </span>
                </div>
                <h3 class="text-base sm:text-lg font-extrabold text-white">${item.title}</h3>
                <ul class="space-y-2 text-sm text-slate-200 leading-relaxed">${detailsHtml}</ul>
              </div>
              <button onclick="${jumpAction}" class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-950 text-teal-300 text-sm font-bold border border-slate-700 flex items-center justify-center gap-1.5 transition">
                <i class="ph-bold ph-map-trifold"></i>
                <span>在 3D 島嶼地圖中定位</span>
              </button>
            </div>
          `;
        })
        .join('');
    }

    function jumpFromListToHint(hintId) {
      toggleViewMode();
      selectHint(hintId);
    }

    function jumpFromListToIsland(islandId) {
      toggleViewMode();
      selectIsland(islandId);
    }

    // 彈窗管理 (Modals)
    function openModal(type) {
      state.activeModal = type;
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      renderModalContent();
    }

    function closeModal() {
      state.activeModal = null;
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function setCalcWeight(w) {
      state.patientWeight = Number(w);
      renderModalContent();
    }

    function selectQuizOption(qNum, key) {
      if (state.quizSubmitted) return;
      state.quizAnswers[qNum] = key;
      renderModalContent();
    }

    function submitQuiz() {
      state.quizSubmitted = true;
      renderModalContent();
    }

    function resetQuiz() {
      state.quizAnswers = {};
      state.quizSubmitted = false;
      renderModalContent();
    }

    function renderModalContent() {
      const box = document.getElementById('modal-content');
      if (!state.activeModal) return;

      if (state.activeModal === 'calculator') {
        const w = Math.max(10, Math.min(150, Number(state.patientWeight) || 60));
        const lidoPlainMg = (w * 4.5).toFixed(0);
        const lidoPlainMl = ((w * 4.5) / 20).toFixed(1);
        const lidoEpiMg = (w * 7).toFixed(0);
        const lidoEpiMl = ((w * 7) / 20).toFixed(1);
        const bupiMg = (w * 3).toFixed(0);
        const lipidBolusMl = (w * 1.5).toFixed(0);
        const lipidInfusionMlHr = (w * 15).toFixed(0);
        const lipidMaxMl = (w * 12).toFixed(0);
        const midaMin = (w * 0.05).toFixed(1);
        const midaMax = (w * 0.1).toFixed(1);
        const lastEpiMaxMcg = (w * 1).toFixed(0);
        const lastEpiMaxMl = (w * 0.1).toFixed(1);
        const anaphFluidInitial = w >= 45 ? '2000 ml (成人 2L)' : `${(w * 20).toFixed(0)} ml (20 ml/kg)`;
        const anaphFluidRefractory = `${(w * 50).toFixed(0)} ml (50 ml/kg)`;

        const presetBtns = [40, 50, 60, 70, 80]
          .map(
            (p) => `
            <button onclick="setCalcWeight(${p})" class="px-3 py-1 rounded-lg text-xs sm:text-sm font-bold transition ${
              w === p ? 'bg-teal-400 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
            }">${p} kg</button>
          `
          )
          .join('');

        box.innerHTML = `
          <div class="bg-slate-900 border-2 border-teal-500/50 rounded-3xl max-w-3xl mx-auto w-full max-h-[90vh] overflow-y-auto text-slate-100 shadow-2xl p-5 sm:p-6 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <div class="flex items-center gap-2.5">
                <div class="p-2 rounded-xl bg-teal-500/20 text-teal-300">
                  <i class="ph-bold ph-calculator text-2xl"></i>
                </div>
                <div>
                  <h3 class="text-lg sm:text-xl font-black text-white">麻醉病安體重劑量速算儀</h3>
                  <p class="text-xs sm:text-sm text-slate-400">對應投影片 P.17–18（過敏輸液/Epi）、P.35（局麻極量）、P.40/P.45（SMOFlipid 20% 劑量表）</p>
                </div>
              </div>
              <button onclick="closeModal()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
                <i class="ph-bold ph-x text-xl"></i>
              </button>
            </div>

            <div class="bg-slate-800/90 rounded-2xl p-4 border border-slate-700 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <label class="text-sm sm:text-base font-bold text-teal-300">設定病患理想體重 (Lean Body Weight)：</label>
                <div class="flex items-center gap-2">${presetBtns}</div>
              </div>
              <div class="flex items-center gap-4">
                <input type="range" min="20" max="120" step="1" value="${w}" oninput="setCalcWeight(this.value)" class="flex-1 accent-teal-400 cursor-pointer" />
                <span class="text-2xl font-black text-amber-400 w-24 text-right">${w} kg</span>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
              <div class="rounded-2xl bg-cyan-950/50 border border-cyan-500/40 p-4 space-y-2">
                <div class="text-xs sm:text-sm font-bold text-cyan-300 flex items-center justify-between">
                  <span>1. 局部麻醉藥極量</span>
                  <span class="bg-cyan-500/20 px-2 py-0.5 rounded">投影片 P.35</span>
                </div>
                <div class="space-y-2 pt-1">
                  <div>
                    <div class="text-xs text-slate-300">Lidocaine (無 Epi, 4.5 mg/kg)</div>
                    <div class="text-base font-black text-white">${lidoPlainMg} mg <span class="text-xs font-semibold text-cyan-300">(2% Xylocaine ${lidoPlainMl} ml)</span></div>
                  </div>
                  <div>
                    <div class="text-xs text-slate-300">Lidocaine (含 Epi, 7 mg/kg)</div>
                    <div class="text-base font-black text-white">${lidoEpiMg} mg <span class="text-xs font-semibold text-cyan-300">(2% Xylocaine ${lidoEpiMl} ml)</span></div>
                  </div>
                  <div>
                    <div class="text-xs text-slate-300">Bupivacaine / Ropivacaine (3 mg/kg)</div>
                    <div class="text-base font-black text-white">${bupiMg} mg</div>
                  </div>
                </div>
              </div>

              <div class="rounded-2xl bg-emerald-950/50 border border-emerald-500/40 p-4 space-y-2">
                <div class="text-xs sm:text-sm font-bold text-emerald-300 flex items-center justify-between">
                  <span>2. 20% SMOFlipid 救援</span>
                  <span class="bg-emerald-500/20 px-2 py-0.5 rounded">投影片 P.40 / P.45</span>
                </div>
                <div class="space-y-2 pt-1">
                  <div>
                    <div class="text-xs text-slate-300">初始 Bolus (1.5 ml/kg, 2-3分推完)</div>
                    <div class="text-lg font-black text-emerald-300">${lipidBolusMl} ml IV</div>
                  </div>
                  <div>
                    <div class="text-xs text-slate-300">持續滴注 Infusion (15 ml/kg/hr)</div>
                    <div class="text-base font-black text-white">${lipidInfusionMlHr} ml/hr</div>
                  </div>
                  <div>
                    <div class="text-xs text-slate-300">最大總劑量上限 (12 ml/kg)</div>
                    <div class="text-base font-black text-amber-300">${lipidMaxMl} ml</div>
                  </div>
                </div>
              </div>

              <div class="rounded-2xl bg-rose-950/50 border border-rose-500/40 p-4 space-y-2">
                <div class="text-xs sm:text-sm font-bold text-rose-300 flex items-center justify-between">
                  <span>3. 急救用藥與輸液</span>
                  <span class="bg-rose-500/20 px-2 py-0.5 rounded">投影片 P.18 / P.40</span>
                </div>
                <div class="space-y-2 pt-1">
                  <div>
                    <div class="text-xs text-slate-300">LAST Epinephrine 減量上限 (≤1 mcg/kg)</div>
                    <div class="text-base font-black text-rose-300">≤ ${lastEpiMaxMcg} mcg <span class="text-xs text-slate-200">(10mcg/ml 抽 ≤${lastEpiMaxMl} ml)</span></div>
                  </div>
                  <div>
                    <div class="text-xs text-slate-300">LAST 抗癲癇 Midazolam (0.05-0.1 mg/kg)</div>
                    <div class="text-base font-black text-white">${midaMin} – ${midaMax} mg (ml)</div>
                  </div>
                  <div>
                    <div class="text-xs text-slate-300">過敏性休克晶體輸液 (Crystalloid)</div>
                    <div class="text-xs font-bold text-amber-200">立即：${anaphFluidInitial}<br/>頑固型：${anaphFluidRefractory}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (state.activeModal === 'sopCompare') {
        box.innerHTML = `
          <div class="bg-slate-900 border-2 border-indigo-500/50 rounded-3xl max-w-4xl mx-auto w-full max-h-[90vh] overflow-y-auto text-slate-100 shadow-2xl p-5 sm:p-6 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <div>
                <h3 class="text-lg sm:text-xl font-black text-white flex items-center gap-2">
                  <i class="ph-bold ph-stack text-indigo-400"></i>
                  麻醉兩大重大病安急症：中榮實戰處理對照表
                </h3>
                <p class="text-xs sm:text-sm text-slate-400 mt-0.5">
                  整合簡報最後兩頁重點（投影片 P.44 過敏性休克處理流程 vs P.45 LAST 局部麻醉藥全身毒性）
                </p>
              </div>
              <button onclick="closeModal()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
                <i class="ph-bold ph-x text-xl"></i>
              </button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="bg-slate-800 text-slate-200">
                    <th class="p-3 rounded-tl-xl w-1/5">比較項目</th>
                    <th class="p-3 text-rose-300 w-2/5 border-l border-slate-700">🚨 重度藥物過敏 (Anaphylaxis) [投影片 P.20, P.44]</th>
                    <th class="p-3 text-emerald-300 rounded-tr-xl w-2/5 border-l border-slate-700">⚡ 局部麻醉藥全身毒性 (LAST) [投影片 P.40, P.45]</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  <tr>
                    <td class="p-3 font-bold text-amber-300">致病機轉</td>
                    <td class="p-3 border-l border-slate-800">IgE 結合肥胖細胞/嗜鹼性球 → 釋放 Histamine 等介質 → 10-15分鐘內 35-70% 血液外滲 (P.3-7)</td>
                    <td class="p-3 border-l border-slate-800">局麻藥阻斷電壓門控鈉離子通道 (Na+ channel)，過量或誤入血管引發中樞與心臟毒性 (P.32-39)</td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold text-amber-300">中榮急救箱位置</td>
                    <td class="p-3 border-l border-slate-800 font-semibold text-white">📦 工作室藥櫃內：「升壓劑＋過敏抽血包」 (P.20)</td>
                    <td class="p-3 border-l border-slate-800 font-semibold text-white">🗄️ PCA 鐵櫃裡最右邊鐵箱：「SMOFlipid 20% (250ml/瓶)」 (P.40)</td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold text-amber-300">首要救命神藥</td>
                    <td class="p-3 border-l border-slate-800"><span class="font-extrabold text-rose-300">腎上腺素 Epinephrine</span><br/>• 中度：10–20 mcg IV<br/>• 危及生命：100–200 mcg IV<br/>• 心跳停止：1 mg IV；Infusion：60 mcg/ml (P.17)</td>
                    <td class="p-3 border-l border-slate-800"><span class="font-extrabold text-emerald-300">20% 脂肪乳劑 (Lipid emulsion)</span><br/>• Bolus：1.5 ml/kg IV (2-3分鐘內)<br/>• Infusion：15 ml/kg/hr (上限 12 ml/kg) (P.40)</td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold text-amber-300">Epinephrine 劑量差異</td>
                    <td class="p-3 border-l border-slate-800">第一線主力升壓支氣管擴張藥，依嚴重度足量給予 (10~200 mcg 或 CPR 1 mg)</td>
                    <td class="p-3 border-l border-slate-800 text-amber-200 font-semibold">⚠️ 必須減少 Epinephrine 劑量至 ≤ 1 mcg/kg！（避免惡化心律不整與干擾脂乳作用）</td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold text-amber-300">禁忌 / 注意用藥</td>
                    <td class="p-3 border-l border-slate-800">補液首選 Crystalloid (2L)，注意 Colloid 本身也可能引起過敏 (P.18)</td>
                    <td class="p-3 border-l border-slate-800">🚫 避免 Vasopressin、β-blocker、CCB、其他局麻藥；血行動力不穩禁用 Propofol (P.40)</td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold text-amber-300">抽血與後續流程</td>
                    <td class="p-3 border-l border-slate-800">抽 5ml 黃紅頭管測 <span class="font-bold text-rose-300">β-tryptase</span>（45-60分達高峰）：<br/>• T1 (2hr內)：白班送3F AIR實驗室(#3350) / 值班電聯檢驗部(#4570)<br/>• T2 (24-48hr)：貼病歷交班恢復室；麻單右下角勾 QA</td>
                    <td class="p-3 border-l border-slate-800">血行動力穩定後 Lipid 續滴 10 分鐘；心律不整用 Amiodarone；嚴重時啟動葉克膜 ECMO team (P.40, P.42)</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (state.activeModal === 'quiz') {
        let score = 0;
        POST_TEST_QUESTIONS.forEach((q) => {
          if (state.quizAnswers[q.qNum] === q.answer) score += 1;
        });

        const questionsHtml = POST_TEST_QUESTIONS.map((q) => {
          const userSelected = state.quizAnswers[q.qNum];
          const isCorrect = userSelected === q.answer;

          const optsHtml = q.options
            .map((opt) => {
              const chosen = userSelected === opt.key;
              let btnStyle = 'bg-slate-900 border-slate-700 text-slate-200 hover:border-amber-400/60';
              if (state.quizSubmitted) {
                if (opt.key === q.answer) {
                  btnStyle = 'bg-emerald-950/90 border-emerald-400 text-emerald-200 font-bold';
                } else if (chosen && opt.key !== q.answer) {
                  btnStyle = 'bg-rose-950/90 border-rose-400 text-rose-200';
                }
              } else if (chosen) {
                btnStyle = 'bg-amber-400 text-slate-950 border-white font-bold shadow';
              }
              return `
                <button onclick="selectQuizOption(${q.qNum}, '${opt.key}')" class="text-left px-3.5 py-3 rounded-xl border text-sm sm:text-base transition ${btnStyle}">
                  ${opt.text}
                </button>
              `;
            })
            .join('');

          const expHtml = state.quizSubmitted
            ? `
              <div class="p-3.5 rounded-xl text-sm leading-relaxed border ${
                isCorrect ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-100' : 'bg-rose-950/40 border-rose-500/40 text-rose-100'
              }">
                <div class="font-extrabold mb-1">${isCorrect ? `✅ 答對了！正確答案：${q.answer}` : `❌ 答錯囉！正確答案為：${q.answer}`}</div>
                <p>${q.explanation}</p>
              </div>
            `
            : '';

          return `
            <div class="rounded-2xl bg-slate-800/80 border border-slate-700 p-4 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="text-xs sm:text-sm font-bold text-amber-300 bg-amber-500/15 px-2.5 py-0.5 rounded-full border border-amber-400/30">${q.hintBadge}</span>
                <span class="text-xs sm:text-sm text-teal-300 font-semibold">📖 對應頁數：${q.slideRef}</span>
              </div>
              <h4 class="text-base sm:text-lg font-extrabold text-white">${q.question}</h4>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${optsHtml}</div>
              ${expHtml}
            </div>
          `;
        }).join('');

        const footerHtml = state.quizSubmitted
          ? `
            <div class="flex items-center gap-3">
              <span class="text-base sm:text-lg font-black text-amber-400">🎉 測驗得分：${score} / ${POST_TEST_QUESTIONS.length} 題（${score * 20} 分）</span>
              <button onclick="resetQuiz()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-bold text-slate-200">重新測驗</button>
            </div>
          `
          : `
            <span class="text-sm text-slate-400">已作答 ${Object.keys(state.quizAnswers).length} / 5 題</span>
            <button onclick="submitQuiz()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-black text-sm sm:text-base shadow-lg hover:from-amber-300 hover:to-orange-400 transition">
              送出批改並查看頁碼解析
            </button>
          `;

        box.innerHTML = `
          <div class="bg-slate-900 border-2 border-amber-400/60 rounded-3xl max-w-3xl mx-auto w-full max-h-[90vh] overflow-y-auto text-slate-100 shadow-2xl p-5 sm:p-6 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <div>
                <span class="text-xs font-extrabold uppercase px-2.5 py-0.5 rounded-full bg-amber-400 text-slate-950">課後測驗自我驗收站</span>
                <h3 class="text-xl font-black text-white mt-1">過敏及局部麻醉藥中毒 — 單選題闖關驗收</h3>
                <p class="text-xs sm:text-sm text-slate-400">完成中央大島 5 座考點提示與對應頁碼複習後，可在此進行課後測驗模擬作答！</p>
              </div>
              <button onclick="closeModal()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
                <i class="ph-bold ph-x text-xl"></i>
              </button>
            </div>
            <div class="space-y-4">${questionsHtml}</div>
            <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800">
              ${footerHtml}
            </div>
          </div>
        `;
      }
    }

    function updateProgressBadges() {
      const hEl = document.getElementById('progress-hints');
      const iEl = document.getElementById('progress-islands');
      if (hEl) hEl.textContent = `${state.visitedHints.length} / 5`;
      if (iEl) iEl.textContent = `${state.visitedIslands.length} / 7`;
    }

    function renderAll() {
      updateProgressBadges();
      renderIslandNavGrid();
      renderSvgMap();
      renderDetailPanel();
      renderAvatarBar();
    }

    // 啟動初始化與吉祥物自動輪播
    window.onload = function () {
      renderAll();
      setInterval(() => {
        nextAvatarQuote();
      }, 7500);
    };
  </script>
</body>
</html>
